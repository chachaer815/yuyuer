<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：锁定缩放，完全固定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CozyHTML~预览台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="toolbar-actions-overlay" id="toolbarOverlay"></div>
    <div class="toolbar-actions" id="toolbarActions">
        <button class="btn btn-warn" id="saveAsProject">另存为</button>
        <button class="btn btn-purple" id="replaceCssBtn">CSS替换</button>
        <button class="btn btn-purple" id="replaceJsonBtn">JSON替换</button>
        <button class="btn btn-success" id="downloadAllBtn">一键全下</button>
        <button class="btn btn-danger" id="cleanCommentBtn">清理注释</button>
        <button class="btn btn-warn" id="formatCode">格式化代码</button>
        <button class="btn btn-purple" id="fontSizeToggle">字号</button>
        <button class="btn btn-warn" id="configFeishu">飞书配置</button>
        <button class="btn btn-warn" id="configGithub">GitHub配置</button>
        <button class="btn btn-danger" id="clearAllBtn">一键清空</button>
    </div>
    <div class="toolbar" id="mainToolbar">
        <button class="btn btn-secondary" id="toggleSidebar">📁</button>
        <button class="btn btn-secondary" id="newProject">新建</button>
        <button class="btn btn-secondary" id="saveProject">💾</button>

        <button class="btn btn-warn" id="importFileBtn">📂 上传</button>
        <input type="file" id="fileInput" accept=".html,.htm,.css,.js,.json" multiple class="hidden">

        <button class="btn btn-secondary" id="downloadSelectBtn">下载</button>
        <button class="btn btn-success" id="mergeExportBtn">导出</button>
        <button class="btn btn-purple" id="splitHtmlBtn">拆分</button>

        <button class="btn btn-secondary" id="undoBtn">↩️</button>
        <button class="btn btn-secondary" id="redoBtn">↪️</button>

        <button class="btn btn-toggle" id="draftToggle">草稿</button>

        <button class="mobile-more-btn" id="moreActionsBtn">•••</button>
    </div>
    <div class="search-bar hidden" id="searchBar">
        <input type="text" id="searchInput" placeholder="搜索...">
        <button class="mini-btn" id="doSearchPrev">↑</button>
        <button class="mini-btn" id="doSearchNext">↓</button>
        <input type="text" id="replaceInput" placeholder="替换为...">
        <button class="mini-btn" id="doReplace">替换</button>
        <button class="mini-btn" id="doReplaceAll">全部</button>
        <button class="mini-btn close-search-btn" id="closeSearch">×</button>
    </div>

    <div class="main-wrap">
        <div class="project-sidebar" id="projectSidebar">
            <div class="sidebar-title">
                <span>我的项目</span>
                <span class="mini-btn" id="refreshProject">刷新</span>
            </div>
            <div class="project-list" id="projectList"></div>
        </div>

        <div class="editor-panel" id="editorPanel">
            <div class="editor-tabs">
                <div class="tab active" data-tab="html">HTML</div>
                <div class="tab" data-tab="css">CSS</div>
                <div class="tab" data-tab="js">JavaScript</div>
                <div class="tab" data-tab="json">JSON</div>
            </div>
            <div class="editor-content">
                <textarea id="htmlEditor" placeholder="编写HTML结构..."></textarea>
                <textarea id="cssEditor" class="hidden" placeholder="编写CSS样式..."></textarea>
                <textarea id="jsEditor" class="hidden" placeholder="编写JavaScript代码..."></textarea>
                <textarea id="jsonEditor" class="hidden" placeholder="编写JSON配置..."></textarea>
            </div>
        </div>

        <div class="preview-panel" id="previewPanel">
            <div class="preview-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span>实时预览</span>
                    <button class="mini-btn" id="refreshPreview">刷新预览</button>
                    <button class="mini-btn" id="fullscreenBtn">全屏</button>
                </div>
            </div>
            <div class="iframe-wrap">
                <iframe id="previewFrame"></iframe>
            </div>
        </div>
    </div>

    <div class="status-bar" id="statusBar">
        <div class="status-item">行<span id="cursorLine">1</span>, 列<span id="cursorCol">1</span></div>
        <div class="status-item">字符<span id="charCount">0</span></div>
        <div class="status-item auto-save-indicator" id="autoSaveIndicator">已自动保存</div>
        <div class="status-item" style="margin-left:auto;">
            <kbd>?</kbd> <span id="shortcutsToggle" style="cursor:pointer;color:#0e639c;">快捷键</span>
        </div>
    </div>

    <div class="shortcuts-hint" id="shortcutsHint">
        <h4>键盘快捷键</h4>
        <div><kbd>Ctrl+Z</kbd> 撤销</div>
        <div><kbd>Ctrl+Y</kbd> 重做</div>
        <div><kbd>Ctrl+S</kbd> 保存</div>
        <div><kbd>Ctrl+F</kbd> 搜索</div>
        <div><kbd>Tab</kbd> 缩进</div>
        <div><kbd>Enter</kbd> 搜索下一个</div>
        <div><kbd>Shift+Enter</kbd> 搜索上一个</div>
        <div><kbd>Ctrl+Enter</kbd> 替换</div>
        <div><kbd>Esc</kbd> 关闭搜索</div>
    </div>

    <dialog id="saveDialog">
        <h3>保存项目</h3>
        <div class="form-group">
            <label>项目名称</label>
            <input type="text" id="projectNameInput" placeholder="输入项目名">
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="cancelSave">取消</button>
            <button class="btn" id="confirmSave">确定保存</button>
        </div>
    </dialog>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
